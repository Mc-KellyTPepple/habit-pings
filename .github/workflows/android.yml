name: Build Android app

on:
  push:
    branches: [main]
    paths:
      - "capacitor/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Check Firebase config secret
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "::error::Add the GOOGLE_SERVICES_JSON repository secret (contents of google-services.json from Firebase)."
            exit 1
          fi

      - name: Install dependencies and create the Android project
        working-directory: capacitor
        run: |
          npm install
          npx cap add android
          npx cap sync android

      - name: Add Firebase config
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: printf '%s' "$GOOGLE_SERVICES_JSON" > capacitor/android/app/google-services.json

      - name: Build debug APK
        working-directory: capacitor/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Name the APK
        run: cp capacitor/android/app/build/outputs/apk/debug/app-debug.apk habit-pings.apk

      - uses: actions/upload-artifact@v4
        with:
          name: habit-pings-apk
          path: habit-pings.apk

      - name: Publish release (stable download link)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: Habit Pings Android (latest)
          body: Latest Android build. Download habit-pings.apk and install it.
          files: habit-pings.apk
          make_latest: true
